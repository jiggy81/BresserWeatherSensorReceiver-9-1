[platformio]
default_envs = ttgo-t-beam

[env:ttgo-t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D LILYGO_T_BEAM_V1_2

lib_deps = 
    jgromes/RadioLib@^7.1.2
    bblanchon/ArduinoJson@^7.0.0
    256dpi/MQTT@^2.5.2
    lewisxhe/XPowersLib@^0.2.6
